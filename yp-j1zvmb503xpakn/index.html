<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>XADAN Yönetim Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b0d14;--panel:#121522;--panel2:#181c2c;--line:#262b40;--text:#e8eaf3;--muted:#8b90a8;
  --qt:#7b61ff;--fq:#ff3d71;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--accent:var(--qt);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--panel2);color:var(--text);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#3a4060}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#ff8a8a}
.btn.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:#7ee2a2}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.hidden{display:none!important}
/* ---------- Giriş ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:30px}
.login-box{width:min(920px,100%)}
.brand{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.brand span{background:linear-gradient(90deg,var(--qt),var(--fq));-webkit-background-clip:text;background-clip:text;color:transparent}
.login-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 12px;font-size:16px}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:10px}
.tag.qt{background:rgba(123,97,255,.15);color:#b3a5ff}.tag.fq{background:rgba(255,61,113,.15);color:#ff9ab4}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.err{color:#ff8a8a}.msg.ok{color:#7ee2a2}
/* ---------- Yerleşim ---------- */
#app{display:flex;height:100%}
aside{width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
aside .brand{font-size:20px;padding:4px 10px 14px}
.switch{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin:0 4px 16px}
.switch button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;font-weight:700}
.switch button.on.qt{background:var(--qt);color:#fff}.switch button.on.fq{background:var(--fq);color:#fff}
.switch button:disabled{opacity:.35}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:2px}
nav a:hover{background:var(--panel2);color:var(--text)}
nav a.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
nav .ico{width:20px;text-align:center}
aside .who{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:12.5px}
main{flex:1;overflow:auto}
.top{position:sticky;top:0;z-index:5;background:rgba(11,13,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:12px}
.top h1{font-size:19px;margin:0;font-weight:800}
.content{padding:22px 26px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.5px}
.stat .l{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.stat .d{font-size:12px;margin-top:6px}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
@media (max-width:1100px){.charts{grid-template-columns:1fr}}
.chart-card{height:300px;display:flex;flex-direction:column}
.chart-card canvas{flex:1;min-height:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click:hover td{background:var(--panel2);cursor:pointer}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 210px)}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;margin-right:4px}
.pill.on{background:rgba(34,197,94,.15);color:#7ee2a2}.pill.bad{background:rgba(239,68,68,.15);color:#ff8a8a}
.pill.adm{background:rgba(245,158,11,.15);color:#fbbf6a}.pill.ver{background:rgba(59,130,246,.15);color:#8fb8ff}
.pill.gray{background:var(--panel2);color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{max-width:320px}
.toolbar select{max-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.post .m{aspect-ratio:1;background:#000;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
.post .m img{width:100%;height:100%;object-fit:cover}
.post .b{padding:9px 10px;font-size:12.5px}
.post .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- Pencere / bildirim ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px}
.dialog.wide{width:min(900px,100%)}
.dialog h2{margin:0 0 6px;font-size:19px}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:14px 0;font-size:13.5px}
.kv div:nth-child(odd){color:var(--muted)}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);padding:11px 14px;border-radius:10px;min-width:260px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;margin-top:12px}
.m1{background:var(--panel2);border-radius:10px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
.m1 .t{flex:1;word-break:break-word;white-space:pre-wrap}
.m1 img,.m1 video{max-width:220px;max-height:220px;border-radius:8px;display:block;margin-top:6px}
pre.crash{white-space:pre-wrap;word-break:break-word;background:#07080d;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;max-height:50vh;overflow:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.section-title{font-size:15px;font-weight:800;margin:22px 0 10px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#7ee2a2;background:rgba(34,197,94,.1);padding:6px 11px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite}
.live.off{color:#ff8a8a;background:rgba(239,68,68,.1)}.live.off i{background:#ef4444;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.fade{animation:fd .25s ease}@keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fcd38d;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>

<!-- ======================= GİRİŞ ======================= -->
<div id="login">
  <div class="login-box" style="width:min(460px,100%)">
    <div class="brand"><span>XADAN</span> Yönetim Paneli</div>
    <div class="muted">Qyriptalk ve FlinQ için tek giriş.</div>
    <div class="card" style="margin-top:22px" id="loginCard">
      <form id="pForm">
        <div class="field"><label>Kullanıcı adı</label><input id="pUser" autocomplete="username" value=""></div>
        <div class="field"><label>Şifre</label><input id="pPass" type="password" autocomplete="current-password"></div>
        <button class="btn primary" type="submit" style="width:100%;justify-content:center;background:linear-gradient(90deg,var(--qt),var(--fq))">Giriş yap</button>
        <div class="msg" id="pMsg"></div>
      </form>
    </div>
    <div id="pick" class="hidden" style="margin-top:22px">
      <div class="muted" style="margin-bottom:10px">Hangi uygulamaya bakmak istiyorsun?</div>
      <div class="login-grid" style="margin-top:0">
        <button class="card pickc" data-k="qt" style="text-align:left;cursor:pointer;color:inherit"><div class="tag qt">Qyriptalk</div><h3>Sohbet · Odalar · Aramalar</h3><div class="muted" id="pickqt"></div></button>
        <button class="card pickc" data-k="fq" style="text-align:left;cursor:pointer;color:inherit"><div class="tag fq">FlinQ</div><h3>Gönderiler · Hikayeler · DM</h3><div class="muted" id="pickfq"></div></button>
      </div>
      <div style="margin-top:14px"><a href="#" id="pOut" class="muted">Çıkış yap</a></div>
    </div>
  </div>
</div>

<!-- ======================= PANEL ======================= -->
<div id="app" class="hidden">
  <aside>
    <div class="brand"><span>XADAN</span> Panel</div>
    <div class="switch">
      <button id="swQt" class="qt">Qyriptalk</button>
      <button id="swFq" class="fq">FlinQ</button>
    </div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main>
    <div class="top"><h1 id="title">Genel bakış</h1><div class="grow"></div><span class="live" id="live"><i></i>Canlı</span></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="toasts"></div>

<script>
"use strict";
// =====================================================================
// AYARLAR
// =====================================================================
const CFG = {
  qt: {
    name: 'Qyriptalk', color: '#7b61ff', repo: 'XADAN-900/qyriptalk-flutter', apk: 'Qyriptalk.apk',
    fb: {
      apiKey: 'AIzaSyCdR7G4TXNyb2wM_OWGJYgpZrgBl8FaWqo',
      authDomain: 'qyriptalk-cdf56.firebaseapp.com',
      databaseURL: 'https://qyriptalk-cdf56-default-rtdb.europe-west1.firebasedatabase.app',
      projectId: 'qyriptalk-cdf56',
      storageBucket: 'qyriptalk-cdf56.firebasestorage.app',
      messagingSenderId: '710550099549',
      appId: '1:710550099549:web:30795fe709cca2b9fa5fb4',
    },
  },
  fq: {
    name: 'FlinQ', color: '#ff3d71', repo: 'XADAN-900/flinq-flutter', apk: 'FlinQ.apk',
    fb: {
      apiKey: 'AIzaSyDdSWxFYZ8YsHFAk-NMpvVPNTdf-QyWvx4',
      authDomain: 'flinq-8e74c.firebaseapp.com',
      databaseURL: 'https://flinq-8e74c-default-rtdb.europe-west1.firebasedatabase.app',
      projectId: 'flinq-8e74c',
      storageBucket: 'flinq-8e74c.appspot.com',
      messagingSenderId: '40261522799',
      appId: '1:40261522799:web:79a7a32902ee7231e7049a',
    },
  },
};
/** Panel hesabının (tek giriş) gizli adresi. Veritabanı kuralları bu hesaba tam yetki verir. */
const PANEL_DOMAIN = '@panel.xadan.app';
const FB = {};
for (const k of ['qt', 'fq']) {
  const app = firebase.initializeApp(CFG[k].fb, k);
  FB[k] = { app, auth: app.auth(), db: app.database() };
}
const S = { cur: 'qt', view: 'overview', sess: { qt: null, fq: null }, charts: {}, errs: {} };
try { S.pass = sessionStorage.getItem('xadan_pp') || null; } catch (_) {}

// =====================================================================
// YARDIMCILAR
// =====================================================================
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PUSH = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
function pushTime(id) {
  if (!id || id.length < 8) return 0;
  if (/^\d{12,14}$/.test(id)) return +id;
  let t = 0;
  for (let i = 0; i < 8; i++) { const v = PUSH.indexOf(id[i]); if (v < 0) return 0; t = t * 64 + v; }
  return t;
}
const pad = (n) => String(n).padStart(2, '0');
function fmt(ms) { if (!ms) return '—'; const d = new Date(ms); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function ago(ms) {
  if (!ms) return '—'; const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'az önce'; if (s < 3600) return Math.floor(s / 60) + ' dk önce';
  if (s < 86400) return Math.floor(s / 3600) + ' sa önce'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' gün önce';
  return fmt(ms);
}
const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function lastDays(n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(dayKey(Date.now() - i * 86400000)); return out; }
const shortDay = (k) => k.slice(8) + '.' + k.slice(5, 7);
const nameKey = (u) => u.trim().toLowerCase().replace(/\./g, ',').replace(/[#$\[\]\/]/g, '_');
const qtPass = (p) => (p.length >= 6 ? p : `qt#${p}#qyrip`);
const qtEmail = (uid, ver = '') => `${uid.toLowerCase()}${ver ? '.' + ver : ''}@users.qyriptalk.app`;
function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 'toast fade ' + type; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 4200);
}
function avatar(name, photo, size = 34) {
  if (photo && String(photo).startsWith('data:image')) return `<img class="av" style="width:${size}px;height:${size}px" src="${esc(photo)}">`;
  const colors = ['#7b61ff', '#ff3d71', '#22c55e', '#0ea5e9', '#f59e0b', '#a855f7'];
  const c = colors[(String(name).charCodeAt(0) || 0) % colors.length];
  return `<span class="av" style="width:${size}px;height:${size}px;background:${c}">${esc(String(name || '?').slice(0, 1).toUpperCase())}</span>`;
}
const db = (k = S.cur) => FB[k].db;
const val = async (path, k = S.cur) => (await db(k).ref(path).get()).val();

async function shallow(path, k = S.cur) {
  const user = FB[k].auth.currentUser;
  const token = user ? await user.getIdToken() : null;
  const r = await fetch(`${CFG[k].fb.databaseURL}/${path}.json?shallow=true${token ? '&auth=' + token : ''}`);
  if (!r.ok) return [];
  const j = await r.json();
  return j && typeof j === 'object' ? Object.keys(j) : [];
}

/** Sadece değişen kısmı yeniden çizer (sayfa titremez, kaydırma ve yazılanlar korunur). */
function patch(el, html) { if (el && el.__html !== html) { el.innerHTML = html; el.__html = html; } }

function dialog(html, wide = false, onClose) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="dialog fade ${wide ? 'wide' : ''}">${html}</div>`;
  const close = () => { o.remove(); onClose && onClose(); };
  o.close = close;
  o.addEventListener('mousedown', (e) => { if (e.target === o) close(); });
  document.body.appendChild(o);
  return o;
}
function ask(title, message, { ok = 'Tamam', danger = false, input = null, textarea = false, value = '', type = 'text' } = {}) {
  return new Promise((res) => {
    const field = input === null ? '' : (textarea
      ? `<textarea id="askIn" placeholder="${esc(input)}">${esc(value)}</textarea>`
      : `<input id="askIn" type="${type}" placeholder="${esc(input)}" value="${esc(value)}">`);
    const o = dialog(`<h2>${esc(title)}</h2><div class="muted" style="margin-bottom:12px">${message}</div>${field}
      <div class="actions"><button class="btn" data-x>Vazgeç</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button></div>`);
    const inp = $('#askIn', o); if (inp) setTimeout(() => inp.focus(), 50);
    $('[data-x]', o).onclick = () => { o.remove(); res(null); };
    $('[data-ok]', o).onclick = () => { const v = inp ? inp.value : true; o.remove(); res(v); };
    if (inp && !textarea) inp.onkeydown = (e) => { if (e.key === 'Enter') $('[data-ok]', o).click(); };
  });
}
async function act(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg, 'ok'); return true; }
  catch (e) {
    const m = String(e && (e.message || e.code) || e);
    toast(/permission|PERMISSION/.test(m) ? 'Yetki yok: güncel veritabanı kurallarını Firebase\'e yapıştırdığından emin ol.' : 'Hata: ' + m, 'err');
    return false;
  }
}

// =====================================================================
// GİRİŞ (tek panel hesabı, iki uygulamaya birden)
// =====================================================================
const panelEmail = (u) => `${u.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '')}${PANEL_DOMAIN}`;
const authOff = (x) => /operation-not-allowed|configuration-not-found|CONFIGURATION_NOT_FOUND/.test(`${x.code} ${x.message}`);
const AUTH_OFF_MSG = (k) => `Firebase'de bu projede giriş sistemi kapalı. Firebase Console → ${CFG[k].fb.projectId} → Authentication → Sign-in method → Email/Password → Etkinleştir.`;

async function panelSignIn(k, email, pass) {
  const auth = FB[k].auth;
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch (x) {
    const c = x.code || '';
    if (authOff(x)) throw new Error(AUTH_OFF_MSG(k));
    if (c === 'auth/too-many-requests') throw new Error('Çok fazla deneme yapıldı. Biraz bekle.');
    if (!/user-not-found|invalid-credential|invalid-login|wrong-password/.test(c)) throw x;
    // Panel hesabı bu projede yoksa ilk girişte oluşturulur.
    try { await auth.createUserWithEmailAndPassword(email, pass); }
    catch (y) {
      if (authOff(y)) throw new Error(AUTH_OFF_MSG(k));
      if (!(y.code || '').includes('email-already-in-use')) throw y;
      // Şifre eşleşmedi: FlinQ'da gömülü anahtar bu şifreyle açılıyorsa panel hesabının
      // şifresini bu şifreye döndür (admin123'ü geri getirir) ve gir.
      if (k === 'fq' && await recoverFqPanel(email, pass)) {
        await auth.signInWithEmailAndPassword(email, pass);
      } else {
        throw new Error('Şifre hatalı.');
      }
    }
  }
}

$('#pForm').onsubmit = async (e) => {
  e.preventDefault();
  const m = $('#pMsg'); m.className = 'msg'; m.textContent = 'Giriş yapılıyor…';
  const user = $('#pUser').value.trim(), pass = $('#pPass').value;

  const email = panelEmail(user);
  S.errs = {};
  S.pass = pass; S.loggingIn = true;
  try { sessionStorage.setItem('xadan_pp', pass); } catch (_) {}
  await Promise.all(['qt', 'fq'].map(async (k) => {
    try { await panelSignIn(k, email, pass); S.sess[k] = { authUid: FB[k].auth.currentUser.uid, name: user }; S.pass = pass; try { sessionStorage.setItem('xadan_pp', pass); } catch (_) {} }
    catch (x) { S.errs[k] = x.message || String(x); }
  }));

  // (o projede Firebase giriş sistemi kapalı olsa bile veritabanına doğrudan bağlanır).
  if (S.sess.fq && !S.sess.qt && !/Şifre hatalı/.test(S.errs.qt || '')) { S.sess.qt = { authUid: '', name: user, direct: true }; delete S.errs.qt; }
  if (S.sess.qt && !S.sess.fq && !/Şifre hatalı/.test(S.errs.fq || '')) { S.sess.fq = { authUid: '', name: user, direct: true }; delete S.errs.fq; }
  if (!S.sess.qt && !S.sess.fq) {
    m.className = 'msg err';

const L = { qt: null, fq: null };
function startLive(k) {
  if (L[k]) return;
  const st = L[k] = { users: null, bans: {}, admins: {}, crashes: {}, reports: {}, ann: {}, stories: {}, rooms: {}, roomMeta: {}, posts: [], postMeta: {}, err: null, ok: true };
  const d = db(k);
  const on = (path, key, q) => (q || d.ref(path)).on('value', (s) => { st[key] = s.val() || {}; st.ok = true; changed(k, key); }, (e) => { st.err = e.message; st.ok = false; changed(k, 'err'); });
  on('users', 'users');
  on('bans', 'bans');
  on('admins', 'admins');
  on('crashReports', 'crashes');
  on('reports', 'reports');
  on('announcements', 'ann', d.ref('announcements').orderByKey().limitToLast(30));
  if (k === 'fq') on('stories', 'stories');
  const conn = d.ref('.info/connected');
  conn.on('value', (s) => { st.online = s.val() === true; if (S.cur === k) liveBadge(); });
  poll(k); st.timer = setInterval(() => poll(k), 10000);
}

/** İçeriği indirmeden sayım: oda mesajları ve gönderi anahtarları (15 sn'de bir). */
async function poll(k) {
  const st = L[k]; if (!st) return;
  try {
    if (k === 'qt') {
      const ids = await shallow('rooms', k);
      const rooms = {};
      await Promise.all(ids.map(async (id) => {
        const [msgs, members] = await Promise.all([shallow(`rooms/${id}/messages`, k), shallow(`rooms/${id}/users`, k)]);
        if (!st.roomMeta[id]) {
          const f = ['name', 'createdBy', 'createdAt', 'isPrivate', 'description'];
          const v = await Promise.all(f.map((x) => val(`rooms/${id}/${x}`, k).catch(() => null)));
          st.roomMeta[id] = { name: v[0] || '(adsız)', createdBy: v[1] || '', createdAt: +v[2] || 0, isPrivate: !!v[3], desc: v[4] || '' };
        }
        rooms[id] = { msgs, members: members.length };
      }));
      st.rooms = rooms;
      changed(k, 'rooms');
    } else {
      const keys = (await shallow('posts', k)).sort().reverse();
      st.posts = keys;
      changed(k, 'posts'); // beğeni / yorum sayıları da tazelenir
    }
  } catch (_) {}
}

let pending = null;
function changed(k, what) {
  if (S.cur !== k || !S.entered) return;
  if (what === 'err') liveBadge();
  if (what === 'reports') renderNav();
  clearTimeout(pending);
  pending = setTimeout(() => { const v = VIEWS[S.view]; v && v.update && v.update(what); }, 120);
}
function liveBadge() {
  const st = L[S.cur]; const el = $('#live'); if (!el || !st) return;
  const ok = st.ok && st.online !== false;
  el.classList.toggle('off', !ok);
  el.lastChild.textContent = ok ? 'Canlı' : (st.err ? 'Yetki hatası' : 'Bağlantı yok');
  el.title = st.err || '';
}

/** Kullanıcı listesi (canlı veriden türetilir). */
function usersOf(k = S.cur) {
  const st = L[k]; if (!st || !st.users) return null;
  return Object.entries(st.users).map(([uid, u]) => {
    u = u || {};
    const b = st.bans[uid];
    return {
      uid, name: u.username || 'Kullanıcı', photo: k === 'qt' ? u.profilePhoto : u.profilePhotoUrl,
      bio: u.bio || '', email: u.email || '', online: !!u.isOnline, lastSeen: +u.lastSeen || 0, created: +u.createdAt || 0,
      verified: !!u.verified, authUid: u.authUid || '', legacy: !!u.password, banned: !!b, banReason: b && b.reason,
      admin: k === 'qt' ? (u.role === 'admin' || !!(u.authUid && st.admins[u.authUid])) : !!st.admins[uid],
    };
  }).sort((a, b) => a.name.localeCompare(b.name, 'tr'));
}

};

function lineChart(id, labels, data, type = 'line') {
  const col = CFG[S.cur].color;
  if (S.charts[id]) { S.charts[id].data.labels = labels; S.charts[id].data.datasets[0].data = data; S.charts[id].update('none'); return; }
  Chart.defaults.color = '#8b90a8'; Chart.defaults.borderColor = '#262b40'; Chart.defaults.font.family = 'Inter';
  S.charts[id] = new Chart($('#' + id), {
    type, data: { labels, datasets: [{ data, borderColor: col, backgroundColor: type === 'bar' ? col : col + '33', fill: true, tension: .35 }] },
    options: { maintainAspectRatio: false, animation: { duration: 400 }, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } },
  });
}
function donut(id, online, offline) {
  if (S.charts[id]) { S.charts[id].data.datasets[0].data = [online, offline]; S.charts[id].update('none'); return; }
  S.charts[id] = new Chart($('#' + id), { type: 'doughnut', data: { labels: ['Çevrimiçi', 'Çevrimdışı'], datasets: [{ data: [online, offline], backgroundColor: ['#22c55e', '#262b40'], borderWidth: 0 }] }, options: { maintainAspectRatio: false, cutout: '70%', animation: { duration: 400 } } });
}

const VIEWS = {};

// ---------------- Genel bakış ----------------
VIEWS.overview = {
  mount(el) {
    el.innerHTML = `<div class="stats" id="ovs">${LOADING}</div>
      <div class="charts">
        <div class="card chart-card"><h3 id="c1t"></h3><canvas id="c1"></canvas></div>
        <div class="card chart-card"><h3>Çevrimiçi durumu</h3><canvas id="c2"></canvas></div>
      </div>
      <div class="charts">
        <div class="card chart-card"><h3 id="c3t">Yeni kayıtlar (son 30 gün)</h3><canvas id="c3"></canvas></div>
        <div class="card chart-card"><h3>Son görülenler</h3><div id="recent" style="overflow:auto"></div></div>
      </div>`;
  },
  update() {
    const k = S.cur, st = L[k], users = usersOf(k);
    if (!users) { patch($('#ovs'), waitMsg()); return; }
    const now = Date.now();
    const online = users.filter((u) => u.online).length;
    const stats = [
      [users.length, 'Toplam kullanıcı', ''],
      [online, 'Şu an çevrimiçi', `<span class="pill on">%${users.length ? Math.round(online / users.length * 100) : 0}</span>`],
      [users.filter((u) => u.created && now - u.created < 7 * 86400000).length, 'Son 7 günde kayıt', ''],
      [users.filter((u) => u.banned).length, 'Askıdaki hesap', ''],
    ];
    const days14 = lastDays(14), act14 = Object.fromEntries(days14.map((d) => [d, 0]));
    if (k === 'qt') {
      let total = 0;
      Object.values(st.rooms).forEach((r) => { total += r.msgs.length; r.msgs.forEach((m) => { const d = dayKey(pushTime(m)); if (d in act14) act14[d]++; }); });
      stats.push([Object.keys(st.rooms).length, 'Oda', ''], [total, 'Oda mesajı', '']);
      $('#c1t').textContent = 'Oda mesajları (son 14 gün)';
    } else {
      st.posts.forEach((p) => { const d = dayKey(pushTime(p)); if (d in act14) act14[d]++; });
      let sc = 0; Object.values(st.stories).forEach((s) => sc += Object.keys(s || {}).length);
      stats.push([st.posts.length, 'Gönderi', ''], [sc, 'Aktif hikaye', ''], [users.filter((u) => u.verified).length, 'Mavi tikli', '']);
      $('#c1t').textContent = 'Yeni gönderiler (son 14 gün)';
    }
    stats.push([Object.keys(st.reports).length, 'Açık şikayet', ''], [Object.keys(st.crashes).length, 'Çökme raporu', '']);
    patch($('#ovs'), stats.map(([v, l, d]) => `<div class="stat"><div class="v">${v.toLocaleString('tr-TR')}</div><div class="l">${l}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`).join(''));
    lineChart('c1', days14.map(shortDay), days14.map((d) => act14[d]));
    donut('c2', online, users.length - online);
    const days = lastDays(30), regs = Object.fromEntries(days.map((d) => [d, 0]));
    users.forEach((u) => { if (u.created) { const d = dayKey(u.created); if (d in regs) regs[d]++; } });
    lineChart('c3', days.map(shortDay), days.map((d) => regs[d]), 'bar');
    if (k === 'fq' && !users.some((u) => u.created)) $('#c3t').textContent = 'Yeni kayıtlar (FlinQ kayıt tarihi tutmuyor)';
    const recent = [...users].sort((a, b) => (b.online - a.online) || (b.lastSeen - a.lastSeen)).slice(0, 12);
    patch($('#recent'), recent.map((u) => `<div class="row" style="padding:6px 0">${avatar(u.name, u.photo, 30)}<span class="grow">${esc(u.name)}</span>${u.online ? '<span class="pill on">çevrimiçi</span>' : `<span class="muted" style="font-size:12px">${ago(u.lastSeen)}</span>`}</div>`).join(''));
  },
};

      const a = b.dataset.a;
      if (a === 'rename') await renameUser(k, u);
      if (a === 'pass') await (k === 'qt' ? setQtPassword(u) : setFqPassword(u));
      if (a === 'verify') await act(() => db(k).ref(`users/${u.uid}/verified`).set(u.verified ? null : true), u.verified ? 'Mavi tik kaldırıldı' : 'Mavi tik verildi ✔️');
      if (a === 'admin') await toggleAdmin(k, u);
      if (a === 'ban') await toggleBan(k, u);
      if (a === 'del' && await deleteUser(k, u)) o.close();

async function renameUser(k, u) {
  const next = (await ask('Kullanıcı adını değiştir', `${esc(u.name)} için yeni ad:`, { input: 'Yeni kullanıcı adı', value: u.name, ok: 'Kaydet' }) || '').trim();
  if (!next || next === u.name) return false;
  if (next.length < 3 || next.length > 24) { toast('Ad 3-24 karakter olmalı.', 'err'); return false; }
  if (k === 'qt') {
    const taken = Object.keys((await val(`usernames/${nameKey(next)}`, 'qt')) || {}).some((x) => x !== u.uid);
    if (taken) { toast('Bu ad başkasında.', 'err'); return false; }
    return act(async () => {
      const up = { [`users/${u.uid}/username`]: next, [`usernames/${nameKey(next)}/${u.uid}`]: true };
      if (nameKey(next) !== nameKey(u.name)) up[`usernames/${nameKey(u.name)}/${u.uid}`] = null;
      await db('qt').ref().update(up);
    }, 'Ad değiştirildi');
  }
  const lo = next.toLowerCase(), old = u.name.toLowerCase();
  const ex = await val(`usernames/${lo}`, 'fq');
  if (ex && ex.uid !== u.uid) { toast('Bu ad başkasında.', 'err'); return false; }
  return act(async () => {
    const up = { [`users/${u.uid}/username`]: next, [`users/${u.uid}/initials`]: next.slice(0, 1).toUpperCase(), [`usernames/${lo}`]: { uid: u.uid, username: next } };
    if (u.email) up[`emails/${lo}`] = u.email;
    if (lo !== old) { up[`usernames/${old}`] = null; up[`emails/${old}`] = null; }
    await db('fq').ref().update(up);
  }, 'Ad değiştirildi');
}

async function setQtPassword(u) {
  const pw = await ask('Yeni şifre belirle', `${esc(u.name)} bundan sonra bu şifreyle girecek.`, { input: 'Yeni şifre', ok: 'Şifreyi değiştir' });
  if (!pw) return false;
  if (pw.length < 4) { toast('Şifre en az 4 karakter olmalı.', 'err'); return false; }
  return act(async () => {
    // Hesap güvenli girişe (Firebase Auth) geçtiyse yeni giriş sürümü oluşturulur.
    if (!u.legacy && u.authUid) {
      const cur = (await val(`authV/${u.uid}`, 'qt')) || '';
      const ver = 'r' + ((cur.startsWith('r') ? (+cur.slice(1) || 0) : 0) + 1);
      let tmp;
      try { tmp = firebase.app('qtReset'); } catch (_) { tmp = firebase.initializeApp(CFG.qt.fb, 'qtReset'); }
      try {
        await db('qt').ref(`authV/${u.uid}`).set(ver);
        const cred = await tmp.auth().createUserWithEmailAndPassword(qtEmail(u.uid, ver), qtPass(pw));
        await tmp.database().ref(`authMap/${cred.user.uid}`).set(u.uid);
        await tmp.auth().signOut();
        const up = { [`users/${u.uid}/authUid`]: cred.user.uid, [`users/${u.uid}/password`]: null, [`authMap/${u.authUid}`]: null };
        if (L.qt.admins[u.authUid]) { up[`admins/${u.authUid}`] = null; up[`admins/${cred.user.uid}`] = true; }
        await db('qt').ref().update(up);
        return;
      } catch (x) {
        await db('qt').ref(`authV/${u.uid}`).set(cur || null).catch(() => {});
        if (!authOff(x)) throw x;
      }
    }
    // Eski yöntem (Firebase giriş sistemi kapalıyken uygulama bu şifreyle girer).
    await db('qt').ref(`users/${u.uid}/password`).set(pw);
  }, 'Şifre değiştirildi ✅');
}

/** Şifre değiştirme için anahtarı hazırla: bellek → panele gömülü şifreli anahtar → kasa → dosya seçimi. */
async function ensureSA() {
  if (getSA()) return getSA();
  if (EMBEDDED_VAULT) {
    // Panelin giriş şifresiyle sormadan açılır (şifre değiştirildiyse veritabanındaki kopyadan).
    if (S.pass) {
      try { const x = await vaultOpen(S.pass); if (x) { SA_MEM = x; return SA_MEM; } } catch (_) {}
      try { SA_MEM = await openEmbedded(S.pass); return SA_MEM; } catch (_) {}
    }
    for (let i = 0; i < 3; i++) {
      const p = await ask('Anahtar şifresi', 'FlinQ şifre değiştirme için anahtar şifresini yaz (bu oturumda bir kez sorulur).', { input: 'Anahtar şifresi', ok: 'Aç', type: 'password' });
      if (!p) return null;
      try { SA_MEM = await openEmbedded(p); return SA_MEM; } catch (_) { toast('Anahtar şifresi hatalı.', 'err'); }
    }
    return null;
  }
  const hasVault = !!(await val('panelVault', 'fq').catch(() => null));
  if (hasVault) {
    let pass = S.pass;
    for (let i = 0; i < 3; i++) {
      if (!pass) pass = await ask('Panel şifreni yaz', 'Kayıtlı FlinQ anahtarını açmak için panel şifren gerekiyor.', { input: 'Panel şifresi', ok: 'Aç', type: 'password' });
      if (!pass) return null;
      try { SA_MEM = await vaultOpen(pass); S.pass = pass; return SA_MEM; } catch (_) { toast('Şifre hatalı.', 'err'); pass = null; }
    }
    return null;
  }
  return (await askServiceKey()) ? getSA() : null;
}
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uStr = (s) => b64u(new TextEncoder().encode(s));
async function signJwt(sa, claims) {
  const pem = sa.private_key.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
  const der = Uint8Array.from(atob(pem), (c) => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('pkcs8', der.buffer, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
  const head = b64uStr(JSON.stringify({ alg: 'RS256', typ: 'JWT', kid: sa.private_key_id }));
  const body = b64uStr(JSON.stringify(claims));
  const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(`${head}.${body}`));
  return `${head}.${body}.${b64u(sig)}`;
}
let saToken = null;
async function saBearer(sa, fresh = false) {
  const now = Math.floor(Date.now() / 1000);
  if (!fresh && saToken && saToken.exp > now + 60) return saToken.value;
  try {
    const assertion = await signJwt(sa, { iss: sa.client_email, scope: 'https://www.googleapis.com/auth/identitytoolkit https://www.googleapis.com/auth/cloud-platform', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600 });
    const r = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `grant_type=${encodeURIComponent('urn:ietf:params:oauth:grant-type:jwt-bearer')}&assertion=${assertion}` });
    const j = await r.json();
    if (j.access_token) { saToken = { value: j.access_token, exp: now + (j.expires_in || 3600) }; return saToken.value; }
  } catch (_) {}
  // Yedek yol: doğrudan imzalı anahtar
  return signJwt(sa, { iss: sa.client_email, sub: sa.client_email, aud: 'https://identitytoolkit.googleapis.com/', iat: now, exp: now + 3600 });
}
/** Gömülü anahtar girilen şifreyle açılıyorsa panel hesabının şifresini o şifreye sıfırlar. */
async function recoverFqPanel(email, pass) {
  try {
    const sa = await openEmbedded(pass).catch(() => null);
    if (!sa) return false;
    SA_MEM = sa;
    const found = await fqAdminCall('lookup', { email: [email] });
    const localId = found && found.users && found.users[0] && found.users[0].localId;
    if (!localId) return false;
    await fqAdminCall('update', { localId, password: pass });
    return true;
  } catch (_) {
    return false;
  }
}

async function fqAdminCall(op, body) {
  const sa = getSA(); if (!sa) throw new Error('Anahtar yok');
  const url = `https://identitytoolkit.googleapis.com/v1/projects/${sa.project_id}/accounts:${op}`;
  for (const fresh of [false, true]) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + await saBearer(sa, fresh) }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return j;
    if (fresh) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  }
}

          }
          pass = np; S.pass = np;
          toast('Panel şifresi değiştirildi. Artık yeni şifreyle gireceksin.', 'ok');

/** Eski FlinQ panelindeki gibi: Firebase'e kurulu "setUserPassword" / "deleteUserAccount" fonksiyonları. */
function fqCallable(name) {
  return FB.fq.app.functions('europe-west1').httpsCallable(name);
}
async function setFqPassword(u) {
  const pw = await ask('Yeni şifre belirle', `${esc(u.name)} bundan sonra bu şifreyle girecek. Telefonda açık oturumu varsa tekrar girmesi gerekebilir.`, { input: 'En az 6 karakter', ok: 'Şifreyi değiştir' });
  if (!pw) return false;
  if (pw.length < 6) { toast('Şifre en az 6 karakter olmalı.', 'err'); return false; }
  // 1) Firebase'deki hazır fonksiyon (eski panelin kullandığı yol) — kurulum gerekmez.
  try {
    await fqCallable('setUserPassword')({ uid: u.uid, newPassword: pw });
    toast('Şifre değiştirildi ✅', 'ok');
    return true;
  } catch (x) {
    console.warn('setUserPassword:', x);
    // 2) Fonksiyon kurulu değilse: Google hizmet anahtarı (bu bilgisayarda bir kez seçilir).
    if (!(await ensureSA())) return false;
    return act(() => fqAdminCall('update', { localId: u.uid, password: pw }), 'Şifre değiştirildi ✅');
  }
}

async function toggleAdmin(k, u) {
  if (k === 'qt' && !u.authUid && !u.admin) { toast('Önce güvenli girişe geçmesi gerekiyor.', 'err'); return false; }
  const ok = await ask(u.admin ? 'Yöneticilikten çıkar' : 'Yönetici yap', `${esc(u.name)} ${u.admin ? 'artık uygulamada yönetici olmayacak.' : 'uygulamada yönetici olacak.'}`, { ok: 'Onayla', danger: u.admin });
  if (!ok) return false;
  if (k === 'qt') return act(() => db('qt').ref().update({ [`users/${u.uid}/role`]: u.admin ? 'user' : 'admin', ...(u.authUid ? { [`admins/${u.authUid}`]: u.admin ? null : true } : {}) }), 'Güncellendi');
  return act(() => db('fq').ref(`admins/${u.uid}`).set(u.admin ? null : true), 'Güncellendi');
}

async function toggleBan(k, u) {
  if (u.banned) {
    if (!(await ask('Askıyı kaldır', `${esc(u.name)} uygulamayı tekrar kullanabilecek.`, { ok: 'Kaldır' }))) return false;
    return act(() => db(k).ref(`bans/${u.uid}`).remove(), 'Askı kaldırıldı');
  }
  const reason = await ask('Hesabı askıya al', `${esc(u.name)} uygulamayı açtığında "Hesabın askıya alındı" ekranını görecek.`, { input: 'Sebep (isteğe bağlı, kullanıcıya gösterilir)', ok: 'Askıya al', danger: true });
  if (reason === null) return false;
  return act(() => db(k).ref(`bans/${u.uid}`).set({ reason: reason.trim(), ts: firebase.database.ServerValue.TIMESTAMP }), 'Hesap askıya alındı');
}

async function deleteUser(k, u) {
  const okWord = await ask('Hesabı sil', `<b>${esc(u.name)}</b> hesabının profil verileri silinecek ve hesap kalıcı olarak askıya alınacak${k === 'fq' ? '; gönderileri ve hikayeleri de silinecek' : ''}. Bu geri alınamaz.<br><br>Onaylamak için kullanıcının adını yaz:`, { input: u.name, ok: 'Kalıcı olarak sil', danger: true });
  if (okWord === null) return false;
  if (okWord.trim() !== u.name) { toast('Ad eşleşmedi, silinmedi.', 'err'); return false; }
  return act(async () => {
    const up = { [`users/${u.uid}`]: null, [`bans/${u.uid}`]: { reason: 'Hesap silindi', ts: Date.now() } };
    if (k === 'qt') {
      up[`usernames/${nameKey(u.name)}/${u.uid}`] = null;
      if (u.authUid) { up[`authMap/${u.authUid}`] = null; up[`admins/${u.authUid}`] = null; }
    } else {
      const lo = u.name.toLowerCase();
      Object.assign(up, { [`usernames/${lo}`]: null, [`emails/${lo}`]: null, [`stories/${u.uid}`]: null, [`storyMedia/${u.uid}`]: null,
        [`following/${u.uid}`]: null, [`notifications/${u.uid}`]: null, [`admins/${u.uid}`]: null });
      const owners = await Promise.all(L.fq.posts.map((p) => val(`posts/${p}/uid`, 'fq').then((x) => [p, x]).catch(() => [p, null])));
      owners.forEach(([p, x]) => { if (x === u.uid) up[`posts/${p}`] = null; });
    }
    await db(k).ref().update(up);
    // Anahtar yüklüyse giriş hesabı da tamamen silinir.
    if (k === 'fq') {
      try { await fqCallable('deleteUserAccount')({ uid: u.uid }); }
      catch (_) { if (getSA()) await fqAdminCall('delete', { localId: u.uid }).catch(() => {}); }
    }
  }, 'Hesap silindi');
}

function roomMessages(id) {
  const m = L.qt.roomMeta[id] || {};
  const names = Object.fromEntries((usersOf('qt') || []).map((u) => [u.uid, u.name]));
  const ref = db('qt').ref(`rooms/${id}/messages`).orderByKey().limitToLast(80);
  const o = dialog(`<div class="row"><h2 class="grow">${esc(m.name)}</h2><span class="live"><i></i>Canlı</span></div><div class="muted">Son 80 mesaj</div><div class="msgs" id="ml">${LOADING}</div><div class="actions"><button class="btn" data-x>Kapat</button></div>`, true, () => ref.off('value', cb));
  $('[data-x]', o).onclick = () => o.close();
  const media = (x) => {
    const d = x.imageData || x.fileData; if (!d) return '';
    if (String(d).startsWith('data:image')) return `<img src="${esc(d)}">`;
    if (String(d).startsWith('data:video')) return `<video src="${esc(d)}" controls></video>`;
    if (String(d).startsWith('data:audio')) return `<audio src="${esc(d)}" controls></audio>`;
    return `<div class="muted">📎 ${esc(x.fileName || 'dosya')}</div>`;
  };
  const cb = (snap) => {
    const list = []; snap.forEach((c) => { list.push([c.key, c.val() || {}]); });
    const box = $('#ml', o); const atTop = box.scrollTop < 30;
    patch(box, list.reverse().map(([mid, x]) => `<div class="m1"><div class="t"><b>${esc(x.sender || names[x.senderUid] || '?')}</b> <span class="muted" style="font-size:12px">${fmt(+x.timestamp || pushTime(mid))}</span><br>${esc(x.text || x.caption || '')}${media(x)}</div>
      <button class="btn sm danger" data-d="${esc(mid)}">🗑️</button></div>`).join('') || '<div class="empty">Mesaj yok</div>');
    if (atTop) box.scrollTop = 0;
  };
  ref.on('value', cb, (e) => patch($('#ml', o), `<div class="empty">${esc(e.message)}</div>`));
  $('#ml', o).onclick = (e) => { const b = e.target.closest('[data-d]'); if (b) act(() => db('qt').ref(`rooms/${id}/messages/${b.dataset.d}`).remove(), 'Mesaj silindi'); };
}

const POST_FIELDS = ['uid', 'username', 'caption', 'type', 'likes', 'timestamp'];
async function postMeta(id, fresh = false) {
  const st = L.fq;
  if (st.postMeta[id] && !fresh) return st.postMeta[id];
  const v = await Promise.all(POST_FIELDS.map((f) => val(`posts/${id}/${f}`, 'fq').catch(() => null)));
  const comments = await shallow(`posts/${id}/comments`, 'fq');
  const prev = st.postMeta[id] || {};
  st.postMeta[id] = { ...prev, id, uid: v[0], username: v[1] || '?', caption: v[2] || '', type: v[3] || 'image', likes: +v[4] || 0, ts: +v[5] || pushTime(id), comments: comments.length };
  return st.postMeta[id];
}
VIEWS.posts = {
  limit: 24,
  mount(el) {
    this.limit = 24;
    el.innerHTML = `<div class="toolbar"><span class="muted" id="pcnt"></span></div><div class="grid" id="pg">${LOADING}</div>
      <div style="text-align:center;margin-top:16px"><button class="btn" id="more">Daha fazla</button></div>`;

    $('#pg').onclick = (e) => { const c = e.target.closest('.post[data-id]'); if (c) postDetail(c.dataset.id); };
  },
  async update(what) {
    const st = L.fq; const keys = st.posts.slice(0, this.limit);
    $('#pcnt').textContent = `${st.posts.length} gönderi · yeni gönderiler otomatik eklenir`;
    $('#more').classList.toggle('hidden', this.limit >= st.posts.length);
    if (!st.posts.length) { patch($('#pg'), st.users ? '<div class="empty">Gönderi yok</div>' : waitMsg()); return; }
    const grid = $('#pg'); grid.__html = null; grid.querySelectorAll('.empty').forEach((x) => x.remove());
    const metas = await Promise.all(keys.map((id) => postMeta(id, what === 'posts')));
    if (S.view !== 'posts') return;
    // Var olan kartları koru, yenilerini ekle, silinenleri kaldır (titreşimsiz).
    const want = new Set(keys);
    grid.querySelectorAll('.post[data-id]').forEach((c) => { if (!want.has(c.dataset.id)) c.remove(); });
    metas.forEach((p, i) => {
      let card = grid.querySelector(`.post[data-id="${CSS.escape(p.id)}"]`);
      const info = `<b>@${esc(p.username)}</b> <span class="muted">· ${ago(p.ts)}</span><div class="cap muted">${esc(p.caption) || '&nbsp;'}</div><div class="muted">❤️ ${p.likes} · 💬 ${p.comments}</div>`;
      if (!card) {
        card = document.createElement('div'); card.className = 'post fade'; card.dataset.id = p.id;
        card.innerHTML = `<div class="m">${p.type === 'text' ? `<div style="padding:12px;text-align:center">${esc(p.caption.slice(0, 120))}</div>` : p.type === 'video' ? '▶ Video' : '<span class="spin"></span>'}</div><div class="b"></div>`;
        if (p.type === 'image') val(`posts/${p.id}/url`, 'fq').then((u) => { $('.m', card).innerHTML = u ? `<img src="${esc(u)}" loading="lazy">` : 'Görsel yok'; }).catch(() => {});
      }
      patch($('.b', card), info);
      const at = grid.children[i];
      if (at !== card) grid.insertBefore(card, at || null);
    });
  },
};

function postDetail(id) {
  const p = L.fq.postMeta[id]; if (!p) return;
  const cref = db('fq').ref(`posts/${id}/comments`);
  const o = dialog(`<div class="row"><h2 class="grow">@${esc(p.username)} gönderisi</h2><button class="btn danger" data-del>🗑️ Gönderiyi sil</button></div>
    <div class="muted">${fmt(p.ts)}</div>

    <div class="actions"><button class="btn" data-x>Kapat</button></div>`, true, () => cref.off('value', cb));
  $('[data-x]', o).onclick = () => o.close();
  $('[data-del]', o).onclick = async () => {
    if (!(await ask('Gönderiyi sil', 'Bu gönderi ve yorumları kalıcı olarak silinecek.', { ok: 'Sil', danger: true }))) return;
    if (await act(() => db('fq').ref(`posts/${id}`).remove(), 'Gönderi silindi')) { o.close(); poll('fq'); }
  };
  if (p.type !== 'text') val(`posts/${id}/url`, 'fq').then((u) => {
    $('#pm', o).innerHTML = !u ? '<span class="muted">Medya yok</span>' : p.type === 'video'
      ? `<video src="${esc(u)}" controls style="max-width:100%;max-height:60vh;border-radius:10px"></video>`
      : `<img src="${esc(u)}" style="max-width:100%;max-height:60vh;border-radius:10px">`;
  });
  let rows = [];
  const cb = (s) => {
    const cs = s.val() || {}; rows = [];
    Object.entries(cs).forEach(([cid, c]) => {
      rows.push({ path: `posts/${id}/comments/${cid}`, c: c || {}, reply: false });
      Object.entries((c && c.replies) || {}).forEach(([rid, r]) => rows.push({ path: `posts/${id}/comments/${cid}/replies/${rid}`, c: r || {}, reply: true }));
    });
    patch($('#pc', o), rows.map((r, i) => `<div class="m1" style="${r.reply ? 'margin-left:28px' : ''}"><div class="t"><b>@${esc(r.c.username || '?')}</b> <span class="muted" style="font-size:12px">${fmt(+r.c.timestamp)}</span><br>${esc(r.c.text)}</div><button class="btn sm danger" data-i="${i}">🗑️</button></div>`).join('') || '<div class="muted">Yorum yok</div>');
  };
  cref.on('value', cb);
  $('#pc', o).onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) act(() => db('fq').ref(rows[+b.dataset.i].path).remove(), 'Yorum silindi'); };
}

      if (await act(() => Promise.all(targets.map((k) => db(k).ref('announcements').push({ title, body, ts: firebase.database.ServerValue.TIMESTAMP }))), 'Duyuru gönderildi 📣')) { $('#at').value = ''; $('#ab').value = ''; }
    };
    $('#al').onclick = (e) => { const b = e.target.closest('[data-d]'); if (b) act(() => db().ref(`announcements/${b.dataset.d}`).remove(), 'Silindi'); };
  },
  update() {
    const list = Object.entries(L[S.cur].ann).sort((a, b) => b[0].localeCompare(a[0]));
    patch($('#al'), list.map(([id, a]) => `<div class="m1"><div class="t"><b>${esc(a.title)}</b> <span class="muted" style="font-size:12px">${fmt(+a.ts)}</span><br>${esc(a.body)}</div><button class="btn sm danger" data-d="${esc(id)}">🗑️</button></div>`).join('') || '<div class="muted">Henüz duyuru yok</div>');
  },
};

// ---------------- Çökme raporları ----------------
VIEWS.crashes = {
  open: new Set(),
  mount(el) {
    el.innerHTML = `<div class="toolbar"><span class="muted grow" id="ccnt"></span><button class="btn danger sm" id="cdel">Hepsini sil</button></div><div id="cl"></div>`;
    $('#cdel').onclick = async () => {
      if (!(await ask('Tüm raporları sil', 'Bütün çökme raporları silinecek.', { ok: 'Sil', danger: true }))) return;
      act(() => db().ref('crashReports').remove(), 'Silindi');
    };
    $('#cl').onclick = (e) => {
      const o = e.target.closest('[data-o]'), d = e.target.closest('[data-d]');
      if (o) { this.open.has(o.dataset.o) ? this.open.delete(o.dataset.o) : this.open.add(o.dataset.o); this.update(); }
      if (d) act(() => db().ref(`crashReports/${d.dataset.d}`).remove(), 'Silindi');
    };
  },
  update() {
    const list = Object.entries(L[S.cur].crashes).map(([id, r]) => ({ id, ...(r || {}) })).sort((a, b) => (+b.ts || 0) - (+a.ts || 0));
    $('#ccnt').textContent = `${list.length} rapor · uygulama çökünce bir sonraki açılışta sessizce gelir`;
    $('#cdel').classList.toggle('hidden', !list.length);
    const first = (r) => (String(r.report || '').split('\n').find((l) => /Exception|Error/.test(l)) || '').trim().slice(0, 140);
    patch($('#cl'), list.map((r) => `<div class="card" style="margin-bottom:10px">
      <div class="row"><b class="grow">${esc(r.username || 'bilinmeyen')}</b><span class="pill gray">${esc(r.app || '')}</span><span class="muted">${fmt(+r.ts)}</span>
      <button class="btn sm" data-o="${esc(r.id)}">${this.open.has(r.id) ? 'Kapat' : 'Aç'}</button><button class="btn sm danger" data-d="${esc(r.id)}">Sil</button></div>
      <div class="muted" style="font-size:12.5px;margin-top:6px">${esc(first(r))}</div>
      ${this.open.has(r.id) ? `<pre class="crash">${esc(r.report)}</pre>` : ''}</div>`).join('') || '<div class="empty">Çökme raporu yok 🎉</div>');
  },
};

// ---------------- Verileri indir ----------------
function download(name, text, type = 'application/json') {
  const blob = new Blob([text], { type: type + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; };
/** Dışa aktarımda şifre alanları asla yer almaz. */
function scrub(users) { const o = {}; Object.entries(users || {}).forEach(([k, v]) => { const c = { ...(v || {}) }; delete c.password; o[k] = c; }); return o; }
async function restJson(path, k = S.cur) {
  const user = FB[k].auth.currentUser; const token = user ? await user.getIdToken() : null;
  const r = await fetch(`${CFG[k].fb.databaseURL}/${path}.json${token ? '?auth=' + token : ''}`);
  if (!r.ok) throw new Error('İndirilemedi (HTTP ' + r.status + ')');
  return r.json();
}
VIEWS.export = {
  mount(el) {
    const k = S.cur, n = CFG[k].name.toLowerCase();
    const items = [
      ['users_csv', '👥 Kullanıcılar (Excel / CSV)', 'Ad, e-posta, durum, son görülme, kayıt, askı, yönetici bilgileri'],
      ['users_json', '👥 Kullanıcılar (JSON)', 'Profil verilerinin tamamı (fotoğraflar dahil)'],
      ...(k === 'qt'
        ? [['rooms', '💬 Odalar ve tüm oda mesajları (JSON)', 'Oda bilgileri, üyeler ve mesajlar']]
        : [['posts', '🖼️ Gönderiler (JSON)', 'Tüm gönderiler, beğeniler, yorumlar (fotoğraf/video dahil)'], ['stories', '⭕ Hikayeler (JSON)', 'Aktif hikayeler']]),
      ['crashes', '🐞 Çökme raporları (JSON)', ''],
      ['ann', '📣 Duyurular (JSON)', ''],
      ['all', '🗄️ Tam yedek (JSON)', 'Veritabanının tamamı. Büyük olabilir, inmesi biraz sürebilir.'],
    ];
    el.innerHTML = `<div class="note">İndirilen dosyalarda kullanıcı şifreleri yer almaz.</div>
      <div class="tbl" style="max-height:none"><table><tbody>${items.map(([id, t, d]) => `<tr><td><b>${t}</b><div class="muted" style="font-size:12.5px">${d}</div></td><td style="text-align:right"><button class="btn primary sm" data-x="${id}">İndir</button></td></tr>`).join('')}</tbody></table></div>`;
    el.querySelectorAll('[data-x]').forEach((b) => b.onclick = async () => {
      const id = b.dataset.x, old = b.textContent; b.disabled = true; b.innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px"></span>';
      try {
        const st = L[k];
        if (id === 'users_csv') {
          const rows = [['kimlik', 'kullanici_adi', 'e_posta', 'hakkinda', 'cevrimici', 'son_gorulme', 'kayit', 'askida', 'yonetici', 'mavi_tik']];
          (usersOf(k) || []).forEach((u) => rows.push([u.uid, u.name, u.email, u.bio, u.online ? 'evet' : 'hayir', fmt(u.lastSeen), fmt(u.created), u.banned ? 'evet' : 'hayir', u.admin ? 'evet' : 'hayir', u.verified ? 'evet' : 'hayir']));
          download(`${n}-kullanicilar-${stamp()}.csv`, '\ufeff' + rows.map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n'), 'text/csv');
        } else if (id === 'users_json') download(`${n}-kullanicilar-${stamp()}.json`, JSON.stringify(scrub(st.users), null, 2));
        else if (id === 'rooms') download(`${n}-odalar-${stamp()}.json`, JSON.stringify(await restJson('rooms', k), null, 2));
        else if (id === 'posts') download(`${n}-gonderiler-${stamp()}.json`, JSON.stringify(await restJson('posts', k), null, 2));
        else if (id === 'stories') download(`${n}-hikayeler-${stamp()}.json`, JSON.stringify(st.stories, null, 2));
        else if (id === 'crashes') download(`${n}-cokme-raporlari-${stamp()}.json`, JSON.stringify(st.crashes, null, 2));
        else if (id === 'ann') download(`${n}-duyurular-${stamp()}.json`, JSON.stringify(st.ann, null, 2));
        else if (id === 'all') {
          const all = await restJson('', k);
          if (all && all.users) all.users = scrub(all.users);
          download(`${n}-tam-yedek-${stamp()}.json`, JSON.stringify(all));
        }
        toast('İndirildi', 'ok');
      } catch (e) { toast('Hata: ' + (e.message || e), 'err'); }
      b.disabled = false; b.textContent = old;
    });
  },
};

// ---------------- Sürümler ----------------
VIEWS.releases = {
  async mount(el) {
    const k = S.cur, repo = CFG[k].repo;
    el.innerHTML = LOADING;
    const r = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=12`, { headers: { Accept: 'application/vnd.github+json' } });
    const list = r.ok ? await r.json() : [];
    el.innerHTML = `
      <div class="note">Uygulamalar açılışta en son sürümü kontrol eder. Yeni sürüm varsa kullanıcıya <b>"Yeni sürüm var → Güncelle"</b> penceresi çıkar; APK iner ve kurulum otomatik açılır.</div>
      <div class="card" style="margin-bottom:14px"><div class="row wrap"><b class="grow">Kalıcı indirme linki</b><code style="word-break:break-all">https://github.com/${repo}/releases/latest/download/${CFG[k].apk}</code>
        <button class="btn sm" id="cp">Kopyala</button></div></div>
      <div class="tbl"><table><thead><tr><th>Sürüm</th><th>Tarih</th><th>Boyut</th><th>İndirme</th><th></th></tr></thead><tbody>
      ${list.map((x, i) => { const a = (x.assets || [])[0] || {}; return `<tr><td><b>${esc(x.tag_name)}</b> ${i === 0 ? '<span class="pill on">en yeni</span>' : ''}</td><td class="muted">${fmt(Date.parse(x.published_at))}</td>
        <td class="muted">${a.size ? (a.size / 1048576).toFixed(1) + ' MB' : '—'}</td><td>${a.download_count ?? '—'}</td><td style="text-align:right">${a.browser_download_url ? `<a class="btn sm" href="${esc(a.browser_download_url)}">APK</a>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">Sürüm bulunamadı</td></tr>'}
      </tbody></table></div>`;
    $('#cp').onclick = () => navigator.clipboard.writeText(`https://github.com/${repo}/releases/latest/download/${CFG[k].apk}`).then(() => toast('Kopyalandı', 'ok'));
  },
};

// Göreli zamanlar ("2 dk önce") için her 30 sn hafif yenileme.
setInterval(() => { if (S.entered && VIEWS[S.view] && VIEWS[S.view].update && !['posts', 'releases'].includes(S.view)) VIEWS[S.view].update('tick'); }, 30000);
</script>
