name: qyriptalk
description: Qyriptalk — gerçek zamanlı sohbet, oda ve sesli arama uygulaması (Flutter).
publish_to: 'none'
version: 2.1.0+21

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_auth: ^5.3.1
  crypto: ^3.0.6
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4

  image_picker: ^1.1.2
  file_picker: ^8.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  flutter_webrtc: ^0.12.2
  flutter_tts: ^4.2.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/
