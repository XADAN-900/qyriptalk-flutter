name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Qyriptalk
  PROJECT: qyriptalk
  FLUTTER_VERSION: '3.29.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # android/ klasöründeki eksik standart dosyaları (Gradle, MainActivity...) üretir;
      # repodaki dosyalara (AndroidManifest, ikonlar, sesler) dokunmaz.
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.xadan --project-name "$PROJECT" .
          rm -rf test
          python3 ci/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: Analyze (bilgi amaçlı)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # Sabit imza (isteğe bağlı): Settings > Secrets > Actions içinde
      # QT_KEYSTORE_B64 ve QT_KEYSTORE_PASSWORD varsa APK bu anahtarla imzalanır ve
      # eski Qyriptalk sürümünün üzerine (verileri silmeden) güncelleme olarak kurulur.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.QT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "APP_KEYSTORE_FILE=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.QT_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.QT_KEY_ALIAS || 'qyriptalk' }}
          APP_KEY_PASSWORD: ${{ secrets.QT_KEY_PASSWORD || secrets.QT_KEYSTORE_PASSWORD }}
          ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          flutter build apk --release --dart-define=FIREBASE_ANDROID_APP_ID="$ANDROID_APP_ID"
          cp build/app/outputs/flutter-apk/app-release.apk "$APP_NAME.apk"
          VN=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK
          path: ${{ env.APP_NAME }}.apk

      # İndirme bağlantısı: releases/latest/download/Qyriptalk.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: ${{ env.APP_NAME }} ${{ env.VERSION_NAME }} (derleme ${{ github.run_number }})
          body: "${{ env.APP_NAME }} Flutter sürümü — Android APK. Telefona indirip kurun."
          files: ${{ env.APP_NAME }}.apk
          make_latest: true
